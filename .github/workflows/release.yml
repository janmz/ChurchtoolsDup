name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v2.1.0)"
        required: true
        type: string

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

env:
  # Current Go release (latest patch with security fixes) for shipped binaries.
  GO_VERSION: "1.27"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run checks
        run: bash scripts/ci.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # User input is passed via env (never expanded into the script) and
      # validated, so a crafted tag name cannot inject shell commands.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "Ungültiger Tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Embed Windows icon
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/embed-windows-icon.sh "$VERSION"

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
        run: |
          set -euo pipefail
          BINARY="churchtools-dup"
          if [ "$GOOS" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi

          PACKAGE="churchtools-dup-${TAG}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${PACKAGE}"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X 'main.BuildTime=${BUILD_TIME}'"

          go build -ldflags "$LDFLAGS" -o "dist/${PACKAGE}/${BINARY}" .
          rm -f rsrc_windows_*.syso
          cp README.md LICENSE "dist/${PACKAGE}/"

          if [ "$GOOS" = "windows" ]; then
            ASSET="dist/${PACKAGE}.zip"
            (cd dist && zip -r "${PACKAGE}.zip" "${PACKAGE}")
          else
            ASSET="dist/${PACKAGE}.tar.gz"
            (cd dist && tar -czf "${PACKAGE}.tar.gz" "${PACKAGE}")
          fi

          test -f "$ASSET"
          ls -lh "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: churchtools-dup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          COUNT=$(find release-assets -type f | wc -l)
          echo "Prepared $COUNT release asset(s):"
          ls -lh release-assets
          if [ "$COUNT" -lt 5 ]; then
            echo "Expected at least 5 platform archives."
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "Ungültiger Tag: $TAG" >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
